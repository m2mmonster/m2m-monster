[project]
name = "m2m-monster"
version = "1.1.0"
description = "Python SDK for m2m.monster: non-custodial agent-to-agent payments over x402 (m2m-split) on Solana."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["solana", "x402", "payments", "agents", "ai-agents", "m2m-split"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "solders>=0.29,<0.30",
  "httpx>=0.28.1,<0.29",
  "attrs>=26.1.0",
]

[project.urls]
Homepage = "https://m2m.monster/llms.txt"
Repository = "https://github.com/m2mmonster/m2m-monster"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m2m_monster"]

[tool.hatch.build.targets.sdist]
include = ["src/m2m_monster", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/m2m_monster/_api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Error texts must match core byte for byte.
per-file-ignores = { "src/m2m_monster/errors.py" = ["E501"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["devnet: integration against Solana Devnet (needs funded test keys in ../.env)"]
addopts = "-m 'not devnet'"
